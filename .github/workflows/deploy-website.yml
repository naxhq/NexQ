name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      # The site builds its release list and waveforms from these files.
      - 'CHANGELOG.md'
      - 'package.json'
      - 'src/lib/releaseWave.mjs'
      - 'src/lib/releaseNotes.mjs'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci
        working-directory: website

      - name: Build Astro
        run: npx astro build
        working-directory: website

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
