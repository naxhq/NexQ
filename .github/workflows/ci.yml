name: CI

on:
  pull_request:
    branches: [main]
  # Also run on main so the README CI badge reflects the default branch.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # The cached target dir keeps whisper-rs-sys's CMakeCache.txt, which pins
      # CMAKE_LINKER to the MSVC toolset of the image that built it. When a runner
      # image update replaces that toolset, CMake reruns against the stale cache and
      # fails ("Check for working C compiler ... broken", link.exe not found), so a
      # new toolset gets its own Rust cache.
      - name: MSVC toolset version
        id: msvc
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $version = (Get-Content "$vs\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt" -Raw).Trim()
          if (-not $version) { throw "MSVC toolset version not found under $vs" }
          Write-Output "MSVC toolset $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Bump when ggml/whisper build flags in src-tauri/.cargo/config.toml change —
          # whisper-rs-sys won't rebuild on env changes, so a stale cache keeps old flags.
          prefix-key: v1-ggml-portable
          key: msvc-${{ steps.msvc.outputs.version }}

      - name: Install dependencies
        run: npm ci

      # tsc plus the production bundle, so a dependency that breaks the
      # build (like Tailwind 4's PostCSS change) fails here
      - name: TypeScript check and build
        run: npm run build

      - name: Frontend tests
        run: npm test

      - name: Cache ONNX Runtime
        uses: actions/cache@v4
        with:
          path: src-tauri/ort
          key: ort-${{ runner.os }}-${{ hashFiles('scripts/fetch-onnxruntime.mjs') }}

      - name: Stage ONNX Runtime
        run: node scripts/fetch-onnxruntime.mjs

      - name: Rust check
        run: cargo check
        working-directory: src-tauri

  check-macos:
    runs-on: macos-15 # Apple Silicon
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: v1-ggml-portable

      - name: Install dependencies
        run: npm ci

      - name: Cache ONNX Runtime
        uses: actions/cache@v4
        with:
          path: src-tauri/ort
          key: ort-${{ runner.os }}-${{ hashFiles('scripts/fetch-onnxruntime.mjs') }}

      - name: Stage ONNX Runtime
        run: node scripts/fetch-onnxruntime.mjs

      - name: Rust check and tests
        shell: bash
        working-directory: src-tauri
        run: |
          source ../scripts/macos-env.sh
          cargo check
          cargo test --lib
