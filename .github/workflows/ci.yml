name: CI

on:
  pull_request:
    branches: [main]
  # Also run on main so the README CI badge reflects the default branch.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Bump when ggml/whisper build flags in src-tauri/.cargo/config.toml change —
          # whisper-rs-sys won't rebuild on env changes, so a stale cache keeps old flags.
          prefix-key: v1-ggml-portable

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Frontend tests
        run: npm test

      - name: Stage ONNX Runtime
        run: node scripts/fetch-onnxruntime.mjs

      - name: Rust check
        run: cargo check
        working-directory: src-tauri

  check-macos:
    runs-on: macos-14 # Apple Silicon
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: v1-ggml-portable

      - name: Install dependencies
        run: npm ci

      - name: Stage ONNX Runtime
        run: node scripts/fetch-onnxruntime.mjs

      - name: Rust check
        shell: bash
        working-directory: src-tauri
        run: |
          source ../scripts/macos-env.sh
          cargo check
