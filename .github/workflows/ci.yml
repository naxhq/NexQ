name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Bump when ggml/whisper build flags in src-tauri/.cargo/config.toml change —
          # whisper-rs-sys won't rebuild on env changes, so a stale cache keeps old flags.
          prefix-key: v1-ggml-portable

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Stage ONNX Runtime
        run: node scripts/fetch-onnxruntime.mjs

      - name: Rust check
        run: cargo check
        working-directory: src-tauri
